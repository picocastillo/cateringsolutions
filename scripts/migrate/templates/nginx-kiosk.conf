# Production-parity nginx site for Kiosk (Ubuntu sites-available).
# Domains match current production: three tiendas, one Rails app, one Puma socket.
#
# Install flow:
#   1. bootstrap uses nginx-kiosk-http-only.conf (no certs yet)
#   2. finalize-server.sh runs certbot, then installs THIS file
#
# Cert path assumes primary name cateringsolutions.com.ar (SAN cert for all domains).

upstream kiosk_puma {
  server unix:/var/www/kiosk/shared/tmp/sockets/puma.sock fail_timeout=0;
}

# HTTPS — all production domains
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cateringsolutions.com.ar tivoglio.com.ar cotidianomarket.ar
              www.cateringsolutions.com.ar www.tivoglio.com.ar www.cotidianomarket.ar;

  root /var/www/kiosk/current/public;

  ssl_certificate     /etc/letsencrypt/live/cateringsolutions.com.ar/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cateringsolutions.com.ar/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 15M;

  gzip on;
  gzip_comp_level 2;
  gzip_proxied any;
  gzip_vary off;
  gzip_types text/plain text/css application/x-javascript text/xml application/xml
             application/rss+xml application/atom+xml image/svg+xml text/javascript
             application/javascript application/json text/mathml;

  # www → apex (HTTPS)
  if ($host = www.cateringsolutions.com.ar) {
    return 301 https://cateringsolutions.com.ar$request_uri;
  }
  if ($host = www.tivoglio.com.ar) {
    return 301 https://tivoglio.com.ar$request_uri;
  }
  if ($host = www.cotidianomarket.ar) {
    return 301 https://cotidianomarket.ar$request_uri;
  }

  location ~* \-sw\.js$ {
    expires 1h;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires max;
    gzip_static on;
    try_files $uri @puma;
  }

  location /cable {
    proxy_pass http://kiosk_puma;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://kiosk_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  error_page 404 /404.html;
  error_page 429 /50x.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {}
}

# HTTP → HTTPS (+ www → apex)
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name cateringsolutions.com.ar tivoglio.com.ar cotidianomarket.ar
              www.cateringsolutions.com.ar www.tivoglio.com.ar www.cotidianomarket.ar;

  client_max_body_size 15M;

  if ($host = www.cateringsolutions.com.ar) {
    return 301 https://cateringsolutions.com.ar$request_uri;
  }
  if ($host = www.tivoglio.com.ar) {
    return 301 https://tivoglio.com.ar$request_uri;
  }
  if ($host = www.cotidianomarket.ar) {
    return 301 https://cotidianomarket.ar$request_uri;
  }

  return 301 https://$host$request_uri;
}

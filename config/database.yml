default: &default
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  username: <%= ENV.fetch('DB_USERNAME', 'root') %>
  password: <%= ENV.fetch('DB_PASSWORD', 'mysqlroot') %>
  host: <%= ENV.fetch('DB_HOST', '127.0.0.1') %>
  port: <%= ENV.fetch('DB_PORT', 3306) %>
  pool: <%= ENV.fetch('DB_POOL', 5) %>
  reconnect: true

development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'kiosk_development') %>

test:
  <<: *default
  database: kiosk_test<%= ENV['TEST_ENV_NUMBER'] %>

production:
  adapter: mysql2
  encoding: utf8mb4
  collation: utf8mb4_unicode_ci
  username: root
  host: 127.0.0.1
  pool: 15
  reconnect: true
  database: kiosk
  password: tanqueta207

# Temporary HTTP-only site for trackerdev staging (before Let's Encrypt certs).
# DOMAIN_PROFILE=trackerdev — two tiendas under *.trackerdev.com.ar

upstream kiosk_puma {
  server unix:/var/www/kiosk/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name cateringsolutions.trackerdev.com.ar tivoglio.trackerdev.com.ar
              www.cateringsolutions.trackerdev.com.ar www.tivoglio.trackerdev.com.ar _;

  root /var/www/kiosk/current/public;
  client_max_body_size 15M;

  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/letsencrypt;
  }

  location /cable {
    proxy_pass http://kiosk_puma;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://kiosk_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {}
}

# Staging HTTPS nginx site for trackerdev (Ubuntu sites-available).
# DOMAIN_PROFILE=trackerdev — Catering Solutions + Ti Voglio only.
#
# Cert path assumes primary name cateringsolutions.trackerdev.com.ar (SAN cert).

upstream kiosk_puma {
  server unix:/var/www/kiosk/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name cateringsolutions.trackerdev.com.ar tivoglio.trackerdev.com.ar
              www.cateringsolutions.trackerdev.com.ar www.tivoglio.trackerdev.com.ar;

  root /var/www/kiosk/current/public;

  ssl_certificate     /etc/letsencrypt/live/cateringsolutions.trackerdev.com.ar/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cateringsolutions.trackerdev.com.ar/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 15M;

  gzip on;
  gzip_comp_level 2;
  gzip_proxied any;
  gzip_vary off;
  gzip_types text/plain text/css application/x-javascript text/xml application/xml
             application/rss+xml application/atom+xml image/svg+xml text/javascript
             application/javascript application/json text/mathml;

  if ($host = www.cateringsolutions.trackerdev.com.ar) {
    return 301 https://cateringsolutions.trackerdev.com.ar$request_uri;
  }
  if ($host = www.tivoglio.trackerdev.com.ar) {
    return 301 https://tivoglio.trackerdev.com.ar$request_uri;
  }

  location ~* \-sw\.js$ {
    expires 1h;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
    expires max;
    gzip_static on;
    try_files $uri @puma;
  }

  location /cable {
    proxy_pass http://kiosk_puma;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://kiosk_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  error_page 404 /404.html;
  error_page 429 /50x.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {}
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name cateringsolutions.trackerdev.com.ar tivoglio.trackerdev.com.ar
              www.cateringsolutions.trackerdev.com.ar www.tivoglio.trackerdev.com.ar;

  client_max_body_size 15M;

  if ($host = www.cateringsolutions.trackerdev.com.ar) {
    return 301 https://cateringsolutions.trackerdev.com.ar$request_uri;
  }
  if ($host = www.tivoglio.trackerdev.com.ar) {
    return 301 https://tivoglio.trackerdev.com.ar$request_uri;
  }

  return 301 https://$host$request_uri;
}

# Temporary HTTP-only site used during bootstrap (before Let's Encrypt certs exist).
# Serves all production domains so certbot HTTP-01 challenges work, then
# finalize-server.sh replaces this with nginx-kiosk.conf (HTTPS).

upstream kiosk_puma {
  server unix:/var/www/kiosk/shared/tmp/sockets/puma.sock fail_timeout=0;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name cateringsolutions.com.ar tivoglio.com.ar cotidianomarket.ar
              www.cateringsolutions.com.ar www.tivoglio.com.ar www.cotidianomarket.ar _;

  root /var/www/kiosk/current/public;
  client_max_body_size 15M;

  # ACME challenges (certbot webroot / nginx plugin)
  location ^~ /.well-known/acme-challenge/ {
    default_type "text/plain";
    root /var/www/letsencrypt;
  }

  location /cable {
    proxy_pass http://kiosk_puma;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  location / {
    try_files $uri @puma;
  }

  location @puma {
    proxy_pass http://kiosk_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
  }

  error_page 404 /404.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {}
}

services:
  mariadb:
    image: mariadb:10.11.9
    container_name: mariadb_10_11_9
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysqlroot
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb_conf/my_custom.cnf:/etc/mysql/conf.d/my_custom.cnf:ro
      # Auto-import on FIRST start only (empty volume). Put dumps in docker/db/
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:latest
    container_name: redis_local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: kiosk_web
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mysqlroot
      DB_NAME: kiosk_development
      # Set AUTO_PREPARE_DB=true if you did NOT import a dump and want schema from schema.rb
      AUTO_PREPARE_DB: "${AUTO_PREPARE_DB:-false}"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  worker:
    build: .
    container_name: kiosk_worker
    restart: unless-stopped
    profiles: ["app"]
    command: ["bundle", "exec", "rake", "jobs:work"]
    environment:
      RAILS_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mysqlroot
      DB_NAME: kiosk_development
      AUTO_PREPARE_DB: "false"
      BUNDLE_INSTALL_ON_START: "true"
      YARN_INSTALL_ON_START: "false"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - node_modules:/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  # One-shot Capistrano runner (no MariaDB/Redis). See docs/CAPISTRANO_DOCKER.md
  deploy:
    build: .
    profiles: ["deploy"]
    working_dir: /app
    entrypoint: []
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - ~/.ssh:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["bundle", "exec", "cap", "production", "deploy"]

  selenium:
    image: selenium/standalone-chrome:4.9.0
    container_name: selenium_chrome
    restart: unless-stopped
    ports:
      - "4444:4444"
      - "7900:7900"
      - "5900:5900"
    environment:
      - SE_SCREEN_WIDTH=1600
      - SE_SCREEN_HEIGHT=900
      - VNC_NO_PASSWORD=1
      - JAVA_OPTS=-Xmx2g -Xms1g
      - SE_NODE_MAX_INSTANCES=10
      - SE_NODE_MAX_SESSIONS=10
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /dev/shm:/dev/shm
    shm_size: 4gb
    mem_limit: 6g
    memswap_limit: 6g
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  bundle_cache:
    driver: local
  node_modules:
    driver: local
